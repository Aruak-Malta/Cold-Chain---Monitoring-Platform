# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy container to Azure Web App - BackColdChain

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/main_backcoldchain.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set container image name
        id: image
        run: |
          repository="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/${repository}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Supabase frontend variables
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Configure VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY under GitHub Actions Variables."
            exit 1
          fi

      - name: Build and push container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: |
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_99BFA4E5B2864C3988B55D22BF61566D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_00D046EC612A4387A08854C147571E7D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9782ECF29CF14329BB2F341CA199B95A }}

      - name: Configure App Service to use the container
        env:
          APP_NAME: BackColdChain
          IMAGE_NAME: ${{ steps.image.outputs.name }}:${{ github.sha }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          if [ -z "$GHCR_USER" ] || [ -z "$GHCR_PULL_TOKEN" ]; then
            echo "::error::Configure GHCR_USER and GHCR_PULL_TOKEN in GitHub Actions secrets. The token must have read:packages access."
            exit 1
          fi

          resource_group="$(az webapp list --query "[?name=='${APP_NAME}'].resourceGroup | [0]" --output tsv)"
          if [ -z "$resource_group" ]; then
            echo "::error::Could not find the Azure Web App '${APP_NAME}' in the selected subscription."
            exit 1
          fi

          az webapp config appsettings set \
            --resource-group "$resource_group" \
            --name "$APP_NAME" \
            --settings WEBSITES_PORT=8000

          az webapp config container set \
            --resource-group "$resource_group" \
            --name "$APP_NAME" \
            --container-image-name "$IMAGE_NAME" \
            --container-registry-url https://ghcr.io \
            --container-registry-user "$GHCR_USER" \
            --container-registry-password "$GHCR_PULL_TOKEN"

          az webapp restart --resource-group "$resource_group" --name "$APP_NAME"
