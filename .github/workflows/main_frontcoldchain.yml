name: Build and deploy frontend to Azure Web App - FrontColdChain

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/main_frontcoldchain.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm i
        working-directory: frontend

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://backcoldchain-dje3apdfdqc6acg4.brazilsouth-01.azurewebsites.net' }}
        run: |
          npm run build

      - name: Prepare App Service package
        working-directory: frontend
        run: |
          mkdir -p deploy
          cp -R dist/. deploy/
          cp server.cjs deploy/server.cjs
          printf '{"private":true,"scripts":{"start":"node server.cjs"}}\n' > deploy/package.json

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-app
          path: frontend/deploy/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_99BFA4E5B2864C3988B55D22BF61566D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_00D046EC612A4387A08854C147571E7D }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_9782ECF29CF14329BB2F341CA199B95A }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: FrontColdChain
          slot-name: Production
